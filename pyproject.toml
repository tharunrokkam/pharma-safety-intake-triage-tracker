[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-tracker"
version = "0.1.0"
description = "Pharma Safety Intake & Triage Tracker - local training prototype (synthetic data only)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pharma_tracker = ["persistence/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "models: tests that need the real HuggingFace encoder weights (auto-skipped when not cached)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["pharma_tracker"]
omit = ["*/ui/*"]
